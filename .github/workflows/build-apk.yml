name: Сборка и публикация APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Сборка APK
    runs-on: ubuntu-latest

    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4

      - name: Настройка Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Предоставление прав на запуск gradlew
        run: chmod +x gradlew

      - name: Сборка Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Загрузка готового APK в артефакты
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Создание релиза и прикрепление APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: latest-release
          name: "Погода Беларуси — Готовый APK (Скачал и установил)"
          body: |
            ### 📱 Готовая сборка приложения «Погода Беларуси»
            
            Файл для прямой установки на Android-смартфон:
            - Скачайте файл **`app-debug.apk`** ниже (в блоке Assets)
            - Откройте его на телефоне и нажмите «Установить»
            - Разрешите установку из неизвестных источников, если телефон запросит подтверждение.
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
